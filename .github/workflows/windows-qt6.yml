name: Windows Qt6
on:
  # push代码时触发workflow
  push:
    # 忽略README.md
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  # pull_request时触发workflow
  pull_request:
    # 忽略README.md
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  release:
    types: [published]
jobs:
  build:
    name: Windows ${{ matrix.arch }} ${{ matrix.build_type }}
    strategy:
      matrix:
        qt_version: [6.12.0]
        build_type: [Release, RelWithDebInfo, Debug]
        platform: [windows-latest, windows-11-arm]
        include:
          - platform: windows-latest
            arch: x64
            qthost: windows
            qtarch: win64_msvc2022_64
          - platform: windows-11-arm
            arch: arm64
            qthost: windows_arm64
            qtarch: win64_msvc2022_arm64
      fail-fast: false

    runs-on: ${{ matrix.platform }}
    env:
      targetName: lemon.exe
    # 步骤
    steps:
      - name: Checking out sources
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - name: Install Python 3.12 version
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: Restoring submodules
        run: git submodule update --init
      # =========================================================================================================
      - name: Install MSVC compiler
        uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: ${{ matrix.arch }}
      - name: Installing Qt - ${{ matrix.arch }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: ${{ matrix.qthost }}
          arch: ${{ matrix.qtarch }}
          cache: true
          setup-python: "false"
          modules: "qtactiveqt"
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      - name: Prepare artifact name
        id: artifact_name
        uses: ./.github/actions/artifact-name
        with:
          platform: win
          arch: ${{ matrix.arch }}
          build-type: ${{ matrix.build_type }}

      - name: Win-${{ matrix.arch }} - ${{ matrix.qt_version }} - Generate Dependencies and Build
        shell: bash
        env:
          CC: cl.exe
          CXX: cl.exe
        run: |
          cmake . \
            -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLEMON_BUILD_INFO="Build for Windows" \
            -DLEMON_BUILD_EXTRA_INFO="Build on Windows ${{ matrix.arch }}" \
            -DENABLE_XLS_EXPORT=ON
          cmake --build . --parallel $(nproc)
      - name: Deploy Qt for tests
        shell: pwsh
        run: |
          Get-ChildItem tests -Recurse -Filter *.exe |
            Where-Object { $_.Name -ne 'sandbox-helper.exe' } |
            ForEach-Object {
              windeployqt $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
      - name: Run tests
        shell: bash
        env:
          QT_LOGGING_RULES: "*.debug=true"        # 强制开启所有 debug 级别日志
          QT_ASSUME_STDERR_HAS_CONSOLE: 1         # 欺骗 Qt，让它以为存在真实的控制台
          QT_FORCE_STDERR_LOGGING: 1
        run: |
          ctest --test-dir . -V --timeout 120
      - name: package
        env:
          archiveName: ${{ steps.artifact_name.outputs.name }}
        shell: pwsh
        run: |
          # 创建文件夹
          New-Item -ItemType Directory -Path $env:archiveName
          # 拷贝exe
          Copy-Item -LiteralPath $env:targetName -Destination $env:archiveName
          # 拷贝依赖
          windeployqt --qmldir . "$env:archiveName\$env:targetName"
          # 打包zip
          Compress-Archive -Path $env:archiveName -DestinationPath "$env:archiveName.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact_name.outputs.name }}.zip
          archive: false
          if-no-files-found: error
      - name: uploadRelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.artifact_name.outputs.name }}.zip
          asset_name: ${{ steps.artifact_name.outputs.name }}.zip
          tag: ${{ github.ref }}
          overwrite: true

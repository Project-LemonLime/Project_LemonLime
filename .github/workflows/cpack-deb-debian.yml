name: CPack - DEB - Debian

on:
  # push代码时触发workflow
  push:
    # 忽略README.md
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  # pull_request时触发workflow
  pull_request:
    # 忽略README.md
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  release:
    types: [published]

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        #distro: [stable, testing, sid]
        build_type: [Release, RelWithDebInfo, Debug]
        distro: [testing, sid]
    name: Debian ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: debian:${{ matrix.distro }}

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git
      - name: Checking out sources
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - name: Trust checkout in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install build dependencies
        run: |
          apt-get install -y build-essential ninja-build qt6-base-dev qt6-tools-dev qt6-svg-dev qt6-image-formats-plugins qt6-translations-l10n cmake pkgconf bash
      - name: Prepare artifact name
        id: artifact_name
        uses: ./.github/actions/artifact-name
        with:
          platform: linux
          arch: x64
          build-type: ${{ matrix.build_type }}
          qmake: qmake6
          variant: ${{ matrix.distro }}
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -GNinja -DEMBED_TRANSLATIONS=OFF -DEMBED_DOCS=OFF -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_DEB=ON -DLEMON_BUILD_INFO="Build for Debian" -DLEMON_BUILD_EXTRA_INFO="Build on $(uname -sr)"
          cmake --build . --target package --parallel $(nproc)
      - name: Rename package
        shell: bash
        run: |
          mv build/LemonLime-*.deb "build/${{ steps.artifact_name.outputs.name }}.deb"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: build/${{ steps.artifact_name.outputs.name }}.deb
          archive: false
          if-no-files-found: error
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/${{ steps.artifact_name.outputs.name }}.deb
          asset_name: ${{ steps.artifact_name.outputs.name }}.deb
          tag: ${{ github.ref }}
          overwrite: true

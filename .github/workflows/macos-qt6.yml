name: MacOS Qt6
on:
  push:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  release:
    types: [published]
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        build_type: [Release, RelWithDebInfo, Debug]
        arch: [x86_64, arm64]
        qt_ver: [6.12.0]
        qt_arch: [clang_64]
    env:
      targetName: lemon
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          cache: true

      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Prepare artifact name
        id: artifact_name
        uses: ./.github/actions/artifact-name
        with:
          platform: macos
          arch: ${{ matrix.arch }}
          build-type: ${{ matrix.build_type }}
      - name: build macos
        run: |
          cmake . \
            -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLEMON_BUILD_INFO="Build for macOS" \
            -DLEMON_BUILD_EXTRA_INFO="Build on $(uname -sr)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" 
          cmake --build . --parallel $(sysctl -n hw.logicalcpu)
      - name: Run tests
        if: ${{ false }}
        run: |
          ctest --test-dir . --output-on-failure --timeout 120
      # tag 打包
      - name: package
        env:
          Qt6_DIR: ../Qt/${{matrix.qt_ver}}/${{matrix.qt_arch}}
        run: |
          # 拷贝依赖
          #mv ${targetName} ${targetName}.app
          export PATH=$Qt6_DIR/bin:$PATH
          macdeployqt ${targetName}.app -qmldir=. -verbose=1 -dmg
          mv "${targetName}.dmg" "${{ steps.artifact_name.outputs.name }}.dmg"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact_name.outputs.name }}.dmg
          archive: false
          if-no-files-found: error
      - name: uploadRelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.artifact_name.outputs.name }}.dmg
          asset_name: ${{ steps.artifact_name.outputs.name }}.dmg
          tag: ${{ github.ref }}
          overwrite: true

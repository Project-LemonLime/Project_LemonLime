name: "Check Clang Format"

on: [push, pull_request]

jobs:
  format:
    name: "Check Clang Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pachadotdev/clang-format@v1.1
        with:
          version: "21"
          auto-commit: true
          commit-message: "style: format codes"
